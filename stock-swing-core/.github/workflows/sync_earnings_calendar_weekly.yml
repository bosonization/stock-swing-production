name: Sync earnings calendar CSV weekly

on:
  workflow_dispatch:
    inputs:
      csv_url:
        description: 'Optional earnings CSV download URL. Leave blank to use Bulk API, then fallback API.'
        required: false
        default: ''
  schedule:
    # Saturday 08:00 JST = Friday 23:00 UTC
    - cron: '0 23 * * 5'

jobs:
  sync-earnings-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Debug JQUANTS_API_KEY
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          python -c "import os; k=os.getenv('JQUANTS_API_KEY',''); print('JQUANTS_API_KEY length:', len(k))"
      - name: Sync earnings calendar CSV/Bulk with API fallback
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQUANTS_EARNINGS_CSV_URL: ${{ github.event.inputs.csv_url || secrets.JQUANTS_EARNINGS_CSV_URL }}
        run: |
          python -m swing_core.cli sync-earnings-csv
