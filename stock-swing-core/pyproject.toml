[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-swing-core"
version = "0.1.0"
description = "Swing trading technical screening MVP"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "yfinance>=0.2.54",
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
  "supabase>=2.10.0",
]

[project.scripts]
stock-swing = "swing_core.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
